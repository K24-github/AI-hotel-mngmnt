import java.time.Duration

plugins {
    id 'application'
}

group = 'hotel'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'hotel.Main'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
    // The eval runs against a live Ollama, so it is opt-in and its settings cross into the forked JVM.
    ['hotel.ai.eval', 'hotel.ai.models', 'hotel.ai.model', 'hotel.ai.endpoint', 'hotel.ai.gpuLayers'].each { key ->
        if (System.getProperty(key) != null) {
            systemProperty key, System.getProperty(key)
        }
    }
}

tasks.register('evalModels', Test) {
    description = 'Scores each model against the eval set. Needs Ollama running.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'hotel.test.ModelEvalTests' }
    systemProperty 'hotel.ai.eval', 'true'
    ['hotel.ai.models', 'hotel.ai.gpuLayers'].each { key ->
        if (System.getProperty(key) != null) {
            systemProperty key, System.getProperty(key)
        }
    }
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
    timeout = Duration.ofMinutes(60)
}

tasks.named('run') {
    workingDir = rootDir
    // The app runs in a forked JVM, so -Dhotel.data has to be handed across explicitly.
    if (System.getProperty('hotel.data') != null) {
        systemProperty 'hotel.data', System.getProperty('hotel.data')
    }
}